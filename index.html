<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Spokes AI Agents | Knowledge26 Lab</title><link rel="stylesheet" /><style>* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  font-family:'Outfit',sans-serif;
  background:#061525;
  color:#e8f4f8;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

.header-img,
.footer-img {
  width:100%;
  display:block;
  flex-shrink:0;
}

.content-wrapper {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}

.game-card {
  background:rgba(10,31,51,0.85);
  border:1px solid rgba(98,216,78,0.15);
  border-radius:12px;
  backdrop-filter:blur(8px);
  padding:32px 28px 28px 28px;
  max-width:350px;
  width:100%;
  box-shadow:0 0 20px rgba(98,216,78,0.10);
  text-align:center;
}

.game-title {
  font-size:1.5rem;
  font-weight:700;
  margin-bottom:18px;
  color:#62d84e;
}

.question {
  font-size:1.1rem;
  margin-bottom:18px;
  color:#e8f4f8;
}

.answers {
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:18px;
}

.answer-btn {
  background:linear-gradient(135deg,#62d84e,#00c7b1);
  color:#061525;
  font-weight:700;
  border-radius:10px;
  padding:12px 24px;
  border:none;
  cursor:pointer;
  transition:transform 0.1s,box-shadow 0.1s;
  font-size:1rem;
  outline:none;
}

.answer-btn:hover {
  transform:translateY(-2px);
  box-shadow:0 0 12px #62d84e44;
}

.status {
  font-size:1rem;
  margin-bottom:12px;
  color:#00c7b1;
  min-height:24px;
}

.restart-btn {
  background:#0e2d47;
  color:#62d84e;
  border:1px solid #62d84e;
  border-radius:8px;
  padding:10px 20px;
  font-weight:600;
  cursor:pointer;
  margin-top:10px;
  transition:background 0.2s,color 0.2s;
}

.restart-btn:hover {
  background:#62d84e;
  color:#061525;
}

@media (max-width:500px) {
  .game-card { padding:18px 6px 18px 6px; }

  .game-title { font-size:1.1rem; }
}
</style></head><body>
  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/header-banner.jpg" class="header-img" alt="Header" style="min-height:140px; background:#061525;" />
  <div class="content-wrapper">
    <div class="game-card">
      <div class="game-title">ServiceNow Australia Quiz 🦘</div>
      <div class="status" id="status"></div>
      <div class="question" id="question"></div>
      <div class="answers" id="answers"></div>
      <button class="restart-btn" id="restartBtn" style="display:none;">Restart Quiz</button>
    </div>
  </div>
  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/footer-banner.jpg" class="footer-img" alt="Footer" style="min-height:28px; background:#0a1f33;" />
  
</body></html>
