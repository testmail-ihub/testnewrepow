<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spokes AI Agents | Knowledge26 Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Outfit', sans-serif;
  background: #061525;
  color: #e8f4f8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}
.header-img, .footer-img {
  width: 100%;
  display: block;
  flex-shrink: 0;
}
.content-card {
  background: rgba(10,31,51,0.85);
  border: 1px solid rgba(98,216,78,0.15);
  border-radius: 12px;
  backdrop-filter: blur(8px);
  padding: 32px 24px;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 0 20px rgba(98,216,78,0.10);
  text-align: center;
}
.game-title {
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 16px;
  color: #62d84e;
}
.question {
  font-size: 1.1rem;
  margin-bottom: 20px;
  color: #e8f4f8;
}
.choices {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}
.choice-btn {
  background: linear-gradient(135deg, #62d84e, #00c7b1);
  color: #061525;
  font-weight: 700;
  border: none;
  border-radius: 10px;
  padding: 12px 24px;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
  font-size: 1rem;
}
.choice-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 20px #62d84e44;
}
.status {
  font-size: 1rem;
  color: #7a9bb5;
  margin-bottom: 12px;
  min-height: 24px;
}
.score {
  font-size: 1.1rem;
  color: #00c7b1;
  margin-bottom: 8px;
}
.restart-btn {
  background: linear-gradient(135deg, #00c7b1, #62d84e);
  color: #061525;
  font-weight: 700;
  border: none;
  border-radius: 10px;
  padding: 10px 20px;
  cursor: pointer;
  margin-top: 10px;
  font-size: 1rem;
}
.restart-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 20px #00c7b144;
}
@media (max-width: 500px) {
  .content-card {
    padding: 18px 6px;
    max-width: 98vw;
  }
  .game-title {
    font-size: 1.3rem;
  }
}
</style>
</head>
<body>
<img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/header-banner.jpg" class="header-img" alt="Header" style="min-height:140px; background:#061525;" />
<div style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
  <div class="content-card">
    <div class="game-title">ServiceNow Release Quiz 🧞</div>
    <div class="score" id="score">Score: 0</div>
    <div class="status" id="status"></div>
    <div class="question" id="question">Loading...</div>
    <div class="choices" id="choices"></div>
    <button class="restart-btn" id="restartBtn" style="display:none;">Restart</button>
  </div>
</div>
<img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/footer-banner.jpg" class="footer-img" alt="Footer" style="min-height:28px; background:#0a1f33;" />
<script>
const questions = [
  {
    q: "Which of these is a real ServiceNow release name?",
    choices: ["Tokyo", "Paris", "London", "All of the above"],
    answer: 3
  },
  {
    q: "What is the ServiceNow release after 'Rome'?",
    choices: ["San Diego", "Tokyo", "Utah", "Vancouver"],
    answer: 0
  },
  {
    q: "Which release introduced the 'Next Experience' UI?",
    choices: ["Quebec", "San Diego", "Orlando", "Utah"],
    answer: 1
  },
  {
    q: "Which of these is NOT a ServiceNow release name?",
    choices: ["Istanbul", "Madrid", "Berlin", "Zurich"],
    answer: 3
  },
  {
    q: "What is the codename for the 2024 Q1 release?",
    choices: ["Utah", "Vancouver", "Washington DC", "Tokyo"],
    answer: 1
  }
];
let current = 0;
let score = 0;
let gameOver = false;
const questionEl = document.getElementById('question');
const choicesEl = document.getElementById('choices');
const statusEl = document.getElementById('status');
const scoreEl = document.getElementById('score');
const restartBtn = document.getElementById('restartBtn');
function showQuestion() {
  if (current >= questions.length) {
    questionEl.textContent = "Quiz Complete!";
    choicesEl.innerHTML = "";
    statusEl.textContent = `Final Score: ${score} / ${questions.length}`;
    restartBtn.style.display = "inline-block";
    gameOver = true;
    return;
  }
  const q = questions[current];
  questionEl.textContent = q.q;
  choicesEl.innerHTML = "";
  statusEl.textContent = "";
  q.choices.forEach((choice, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice;
    btn.onclick = () => selectAnswer(idx);
    choicesEl.appendChild(btn);
  });
  restartBtn.style.display = "none";
}
function selectAnswer(idx) {
  if (gameOver) return;
  const q = questions[current];
  if (idx === q.answer) {
    statusEl.textContent = "Correct! 🧞";
    score++;
    scoreEl.textContent = `Score: ${score}`;
  } else {
    statusEl.textContent = `Wrong! The correct answer was: \"${q.choices[q.answer]}\"`;
  }
  current++;
  setTimeout(showQuestion, 1100);
}
function restartGame() {
  current = 0;
  score = 0;
  gameOver = false;
  scoreEl.textContent = `Score: 0`;
  showQuestion();
}
restartBtn.onclick = restartGame;
showQuestion();
</script>
</body>
</html>
