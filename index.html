<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spokes AI Agents | Knowledge26 Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Outfit', sans-serif;
  background: #061525;
  color: #e8f4f8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}
.header-img, .footer-img {
  width: 100%;
  display: block;
  flex-shrink: 0;
}
.content-card {
  background: rgba(10,31,51,0.85);
  border: 1px solid rgba(98,216,78,0.15);
  border-radius: 12px;
  backdrop-filter: blur(8px);
  padding: 32px 24px;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 0 20px rgba(98,216,78,0.10);
  text-align: center;
}
.game-question {
  font-size: 1.2rem;
  margin-bottom: 24px;
  color: #e8f4f8;
  font-weight: 600;
}
.choices {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 24px;
}
.choice-btn {
  background: linear-gradient(135deg, #62d84e, #00c7b1);
  color: #061525;
  font-weight: 700;
  border-radius: 10px;
  padding: 12px 24px;
  border: none;
  cursor: pointer;
  font-size: 1rem;
  transition: transform 0.1s, box-shadow 0.1s;
}
.choice-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 20px #62d84e44;
}
.status {
  font-size: 1rem;
  color: #7a9bb5;
  margin-bottom: 16px;
  min-height: 24px;
}
.restart-btn {
  margin-top: 12px;
  background: #0e2d47;
  color: #62d84e;
  border: 1px solid #62d84e;
  border-radius: 8px;
  padding: 10px 20px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.restart-btn:hover {
  background: #62d84e;
  color: #061525;
}
@media (max-width: 600px) {
  .content-card { padding: 20px 8px; }
  .game-question { font-size: 1rem; }
  .choice-btn { font-size: 0.95rem; padding: 10px 12px; }
}
</style>
</head>
<body>
<img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/header-banner.jpg" class="header-img" alt="Header" style="min-height:140px; background:#061525;" />
<div style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
  <div class="content-card">
    <div class="game-question" id="question">Loading question...</div>
    <div class="choices" id="choices"></div>
    <div class="status" id="status"></div>
    <button class="restart-btn" id="restartBtn" style="display:none;">Restart</button>
  </div>
</div>
<img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/footer-banner.jpg" class="footer-img" alt="Footer" style="min-height:28px; background:#0a1f33;" />
<script>
const questions = [
  {
    q: "Which ServiceNow release introduced Flow Designer?",
    choices: ["London", "Madrid", "Orlando", "Paris"],
    answer: "London"
  },
  {
    q: "What is the codename for the ServiceNow release after Quebec?",
    choices: ["Rome", "San Diego", "Tokyo", "Utah"],
    answer: "Rome"
  },
  {
    q: "Which release brought the Now Experience UI Framework?",
    choices: ["Orlando", "Paris", "Quebec", "San Diego"],
    answer: "Orlando"
  },
  {
    q: "Which ServiceNow release was named after a city in Japan?",
    choices: ["Tokyo", "Paris", "Rome", "Utah"],
    answer: "Tokyo"
  },
  {
    q: "Which release introduced App Engine Studio?",
    choices: ["Paris", "Quebec", "Rome", "San Diego"],
    answer: "Quebec"
  }
];
let current = 0;
let score = 0;
const questionDiv = document.getElementById('question');
const choicesDiv = document.getElementById('choices');
const statusDiv = document.getElementById('status');
const restartBtn = document.getElementById('restartBtn');
function showQuestion() {
  if (current >= questions.length) {
    questionDiv.textContent = `Game Over! Your score: ${score} / ${questions.length}`;
    choicesDiv.innerHTML = '';
    statusDiv.textContent = score === questions.length ? "Perfect! You're a ServiceNow Release Guru!" : "Try again to improve your score.";
    restartBtn.style.display = 'inline-block';
    return;
  }
  const q = questions[current];
  questionDiv.textContent = q.q;
  choicesDiv.innerHTML = '';
  q.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice;
    btn.onclick = () => checkAnswer(choice);
    choicesDiv.appendChild(btn);
  });
  statusDiv.textContent = '';
  restartBtn.style.display = 'none';
}
function checkAnswer(choice) {
  const correct = questions[current].answer;
  if (choice === correct) {
    statusDiv.textContent = 'Correct!';
    score++;
  } else {
    statusDiv.textContent = `Wrong! The correct answer was: ${correct}`;
  }
  current++;
  setTimeout(showQuestion, 1200);
}
restartBtn.onclick = function() {
  current = 0;
  score = 0;
  showQuestion();
};
showQuestion();
</script>
</body>
</html>
