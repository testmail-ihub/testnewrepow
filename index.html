<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spokes AI Agents | Knowledge26 Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #061525;
      color: #e8f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .header-img, .footer-img {
      width: 100%;
      display: block;
      flex-shrink: 0;
    }
    .game-card {
      background: rgba(10,31,51,0.85);
      border: 1px solid rgba(98,216,78,0.15);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(98,216,78,0.08);
      padding: 32px 28px 24px 28px;
      max-width: 370px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .game-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 18px;
      color: #62d84e;
    }
    .question {
      font-size: 1.1rem;
      margin-bottom: 18px;
      color: #e8f4f8;
    }
    .choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }
    .choice-btn {
      background: linear-gradient(135deg, #62d84e, #00c7b1);
      color: #061525;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 12px 0;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 2px 8px 0 rgba(98,216,78,0.10);
    }
    .choice-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px 0 #00c7b1;
    }
    .result {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 10px;
      color: #00c7b1;
      min-height: 28px;
    }
    .next-btn {
      margin-top: 18px;
      background: linear-gradient(135deg, #62d84e, #00c7b1);
      color: #061525;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 12px 0;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 2px 8px 0 rgba(98,216,78,0.10);
    }
    .next-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px 0 #62d84e;
    }
    @media (max-width: 500px) {
      .game-card {
        padding: 18px 6px 16px 6px;
        max-width: 98vw;
      }
      .game-title {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/header-banner.jpg" class="header-img" alt="Header" style="min-height:140px; background:#061525;" />
  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
    <div class="game-card">
      <div class="game-title">ServiceNow Release Quiz 🧞</div>
      <div class="question" id="question">Loading...</div>
      <div class="choices" id="choices"></div>
      <div class="result" id="result"></div>
      <button class="next-btn" id="nextBtn" style="display:none;">Next</button>
    </div>
  </div>
  <img src="https://raw.githubusercontent.com/testmail-ihub/spokes-ai-assets/main/footer-banner.jpg" class="footer-img" alt="Footer" style="min-height:28px; background:#0a1f33;" />
  <script>
    // ServiceNow Release Quiz Game
    const questions = [
      {
        q: "Which of these is a real ServiceNow release name?",
        choices: ["Tokyo", "Berlin", "London", "Paris"],
        answer: "Tokyo"
      },
      {
        q: "Which release came after Utah?",
        choices: ["Vancouver", "Tokyo", "Rome", "Orlando"],
        answer: "Vancouver"
      },
      {
        q: "Which of these is NOT a ServiceNow release?",
        choices: ["Washington", "Zurich", "Quebec", "San Diego"],
        answer: "Zurich"
      },
      {
        q: "What is the codename for the 2024 Q1 release?",
        choices: ["Washington", "Vancouver", "Utah", "Tokyo"],
        answer: "Washington"
      },
      {
        q: "Which release is the oldest?",
        choices: ["Tokyo", "Utah", "Vancouver", "Orlando"],
        answer: "Orlando"
      }
    ];
    let current = 0;
    let score = 0;
    const questionDiv = document.getElementById('question');
    const choicesDiv = document.getElementById('choices');
    const resultDiv = document.getElementById('result');
    const nextBtn = document.getElementById('nextBtn');

    function showQuestion() {
      resultDiv.textContent = '';
      nextBtn.style.display = 'none';
      const q = questions[current];
      questionDiv.textContent = q.q;
      choicesDiv.innerHTML = '';
      q.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice;
        btn.onclick = () => selectAnswer(choice);
        choicesDiv.appendChild(btn);
      });
    }

    function selectAnswer(choice) {
      const q = questions[current];
      Array.from(choicesDiv.children).forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === q.answer) {
          btn.style.background = '#62d84e';
          btn.style.color = '#061525';
        } else if (btn.textContent === choice) {
          btn.style.background = '#7a9bb5';
          btn.style.color = '#061525';
        }
      });
      if (choice === q.answer) {
        resultDiv.textContent = 'Correct! 🎉';
        score++;
      } else {
        resultDiv.textContent = `Oops! The correct answer was "${q.answer}".`;
      }
      nextBtn.style.display = 'block';
    }

    nextBtn.onclick = () => {
      current++;
      if (current < questions.length) {
        showQuestion();
      } else {
        showFinal();
      }
    };

    function showFinal() {
      questionDiv.textContent = 'Quiz Complete!';
      choicesDiv.innerHTML = '';
      resultDiv.innerHTML = `You scored <span style='color:#62d84e;'>${score} / ${questions.length}</span>!`;
      nextBtn.textContent = 'Restart';
      nextBtn.style.display = 'block';
      nextBtn.onclick = () => {
        current = 0;
        score = 0;
        nextBtn.textContent = 'Next';
        showQuestion();
      };
    }

    // Start game
    showQuestion();
  </script>
</body>
</html>
